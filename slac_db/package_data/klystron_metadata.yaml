# Per-station klystron PV overrides for stations that deviate from the normal
# KLYS:LI{sector}:{station}1:{SUFFIX} pattern.
#
# Normal stations have all PVs derived algorithmically from cs_name:
#   ampl_pvname         = {cs_name}:ENLD
#   phase_act_pvname    = {cs_name}:PHAS
#   phase_des_pvname    = {cs_name}:PDES
#   accelerate_pvname   = {cs_name}:BEAMCODE{n}_STAT
#   swrd_pvname         = {cs_name}:SWRD
#   stat_pvname         = {cs_name}:STAT
#   hdsc_pvname         = {cs_name}:HDSC
#   dsta_pvname         = {cs_name}:DSTA
#
# Only fields that differ from the normal pattern are listed here.
# beamcode-dependent PVs are listed per beamcode key (1 = cu_hxr, 2 = cu_sxr).

# --- GUN ---
K20_6:
  description: GUN klystron
  ampl_act_pvname: GUN:IN20:1:GN1_AAVG
  ampl_des_pvname: GUN:IN20:1:GN1_ADES
  phase_act_pvname: GUN:IN20:1:GN1_PAVG
  phase_des_pvname: GUN:IN20:1:GN1_PDES
  accelerate_pvname: ''
  swrd_pvname: ''
  stat_pvname: ''
  hdsc_pvname: ''
  dsta_pvname: ''

